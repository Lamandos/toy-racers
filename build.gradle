buildscript {
  repositories {
    mavenCentral()
    gradlePluginPortal()
    mavenLocal()
    google()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
  }
  dependencies {
    classpath 'com.android.tools.build:gradle:9.3.1'
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    classpath "io.gitlab.arturbosch.detekt:detekt-gradle-plugin:$detektVersion"
    classpath "org.jlleitschuh.gradle:ktlint-gradle:$ktlintGradleVersion"
    classpath 'info.solidsoft.gradle.pitest:gradle-pitest-plugin:1.19.0'
  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir = file('build/classes/java/main')
      testOutputDir = file('build/classes/java/test')
    }
  }
}

configure(subprojects - project(':android')) {
  apply plugin: 'java-library'
  apply plugin: 'kotlin'
  java.sourceCompatibility = 21

  def assetsFolder = rootProject.file('assets')
  def generatedAssetsFile = layout.buildDirectory.file('generated/assets/assets.txt')

  tasks.register('generateAssetList') {
    inputs.dir(assetsFolder)
    outputs.file(generatedAssetsFile)
    doLast {
      def assetsFile = generatedAssetsFile.get().asFile
      assetsFile.parentFile.mkdirs()
      def assetPaths =
        fileTree(assetsFolder) {
          exclude 'assets.txt'
        }.files.collect {
          assetsFolder.toPath().relativize(it.toPath()).toString().replace(File.separatorChar.toString(), '/')
        }.sort()
      assetsFile.text = assetPaths.join("\n") + "\n"
    }
  }
  sourceSets.main.resources.exclude 'assets.txt'
  processResources {
    dependsOn tasks.named('generateAssetList')
    from(generatedAssetsFile)
  }

  compileJava {
    options.incremental = true
  }
  compileKotlin.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)
  compileTestKotlin.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21)

}

def checkedInAssetsFile = rootProject.file('assets/assets.txt')
def generatedAssetsFile = project(':core').layout.buildDirectory.file('generated/assets/assets.txt')

tasks.register('updateAssetList') {
  group = 'maintenance'
  description = 'Updates the checked-in Android asset manifest from the generated asset list.'
  dependsOn ':core:generateAssetList'
  doLast {
    checkedInAssetsFile.text = generatedAssetsFile.get().asFile.text
  }
}

tasks.register('verifyAssetList') {
  group = 'verification'
  description = 'Verifies that the checked-in Android asset manifest matches the assets directory.'
  dependsOn ':core:generateAssetList'
  inputs.file checkedInAssetsFile
  inputs.file generatedAssetsFile
  doLast {
    def generatedManifest = generatedAssetsFile.get().asFile.text
    if (checkedInAssetsFile.text != generatedManifest) {
      throw new GradleException('assets/assets.txt is out of date. Run ./gradlew updateAssetList.')
    }
  }
}

subprojects {
  apply plugin: 'io.gitlab.arturbosch.detekt'
  apply plugin: 'org.jlleitschuh.gradle.ktlint'

  version = "$projectVersion"
  ext.appName = 'ToyRacers'
  repositories {
    mavenCentral()
    // You may want to remove the following line if you have errors downloading dependencies.
    mavenLocal()
    maven { url = 'https://central.sonatype.com/repository/maven-snapshots/' }
    maven { url = 'https://jitpack.io' }
  }

  ktlint {
    version = ktlintVersion
    android = project.name == 'android'
    ignoreFailures = false
    verbose = true
    outputToConsole = true
    filter {
      exclude { entry ->
        entry.file.path.contains("${File.separator}build${File.separator}") ||
            entry.file.path.contains("${File.separator}generated${File.separator}")
      }
    }
  }

  detekt {
    buildUponDefaultConfig = true
    allRules = false
    parallel = true
    ignoreFailures = false
    config.setFrom(rootProject.files('config/detekt/detekt.yml'))
    source.setFrom(fileTree(projectDir) {
      include 'src/main/kotlin/**/*.kt', 'src/main/java/**/*.java'
      include 'src/test/kotlin/**/*.kt', 'src/test/java/**/*.java'
      include 'src/uiSmoke/kotlin/**/*.kt', 'src/uiSmoke/java/**/*.java'
      exclude '**/build/**', '**/generated/**', '**/StartupHelper.kt'
    })
  }
}

eclipse.project.name = 'ToyRacers' + '-parent'

tasks.register('unitTest') {
  group = 'verification'
  description = 'Runs the regular JVM unit-test suite.'
  dependsOn ':core:test', ':lwjgl3:test'
}

tasks.register('behavioralCompatibilityTest') {
  group = 'verification'
  description = 'Runs checked-in behavioral compatibility fixtures and golden masters.'
  dependsOn ':core:behavioralCompatibilityTest', ':core:compatibilityGoldenTest'
}

tasks.register('deterministicRepeatTest') {
  group = 'verification'
  description = 'Runs the long-running deterministic repeat suite.'
  dependsOn ':core:deterministicRepeatTest'
}

tasks.register('behavioralStabilityTest') {
  group = 'verification'
  description = 'Runs the complete behavioral fixture inventory twenty times in sequence.'
  dependsOn ':core:behavioralStabilityTest'
}

tasks.register('behavioralTest') {
  group = 'verification'
  description = 'Runs the primary behavioral compatibility and deterministic repeat suite.'
  dependsOn tasks.named('behavioralCompatibilityTest'), tasks.named('deterministicRepeatTest')
}

tasks.register('fuzzSmokeTest') {
  group = 'verification'
  description = 'Runs the optional fixed-seed differential fuzz smoke suite.'
  dependsOn ':core:differentialFuzzSmokeTest'
}

tasks.register('dartCompatibilityTest', Exec) {
  group = 'verification'
  description = 'Replays the complete Dart compatibility inventory against Kotlin goldens.'
  workingDir rootProject.file('dart')
  def dartExecutable = providers.gradleProperty('dartExecutable').orElse('dart')
  executable dartExecutable.get()
  args 'run', 'tool/full_behavioral_gate.dart'
  inputs.dir(rootProject.file('compatibility/scenarios'))
  inputs.dir(rootProject.file('compatibility/golden'))
  inputs.dir(rootProject.file('compatibility/schemas'))
  inputs.dir(rootProject.file('dart/lib'))
  inputs.dir(rootProject.file('dart/tool'))
  outputs.upToDateWhen { false }
}

tasks.register('dartUnitTest', Exec) {
  group = 'verification'
  description = 'Runs the complete Dart and Flutter unit-test suite.'
  workingDir rootProject.file('dart')
  def flutterExecutable = providers.gradleProperty('flutterExecutable').orElse('flutter')
  executable flutterExecutable.get()
  args 'test', '--coverage'
  inputs.dir(rootProject.file('dart/lib'))
  inputs.dir(rootProject.file('dart/test'))
  inputs.file(rootProject.file('dart/pubspec.lock'))
  outputs.upToDateWhen { false }
}

tasks.register('dartMigrationStageCheck', Exec) {
  group = 'verification'
  description = 'Runs focused Dart tests and every protected compatibility category for one migration subsystem.'
  workingDir rootProject.file('dart')
  def dartExecutable = providers.gradleProperty('dartExecutable').orElse('dart')
  def subsystem = providers.gradleProperty('subsystem')
  executable dartExecutable.get()
  doFirst {
    if (!subsystem.isPresent()) {
      throw new GradleException(
        'dartMigrationStageCheck requires -Psubsystem=<compatibility-category>',
      )
    }
    args 'run', 'tool/migration_regression_gate.dart', '--subsystem', subsystem.get()
  }
  inputs.dir(rootProject.file('compatibility/scenarios'))
  inputs.dir(rootProject.file('compatibility/golden'))
  inputs.dir(rootProject.file('dart/lib'))
  inputs.dir(rootProject.file('dart/test'))
  inputs.dir(rootProject.file('dart/tool'))
  outputs.upToDateWhen { false }
}

tasks.register('dartStressDeterminismTest') {
  group = 'verification'
  description = 'Runs Dart long-running determinism and Kotlin comparison stress checks.'
  dependsOn ':core:dartStressDeterminismTest'
}

tasks.register('coverageReport') {
  group = 'verification'
  description = 'Generates and verifies the core JVM unit-test coverage report.'
  dependsOn ':core:jacocoTestReport', ':core:jacocoTestCoverageVerification'
}

tasks.register('mutationTest') {
  group = 'verification'
  description = 'Verifies mutation strength for the critical deterministic gameplay rule systems.'
  dependsOn ':core:pitest'
}

tasks.register('verifySourceFileLengths') {
  group = 'verification'
  description = 'Fails when a Kotlin or Java source file exceeds 500 lines.'
  def sourceFiles = fileTree(rootDir) {
    include '**/*.kt', '**/*.java'
    exclude '**/build/**', '**/generated/**', '**/.gradle/**'
  }
  inputs.files(sourceFiles)
  doLast {
    def violations = sourceFiles.files.findAll { it.readLines().size() > 500 }.sort()
    if (!violations.empty) {
      def details = violations.collect { file ->
        "${rootDir.toPath().relativize(file.toPath())}: ${file.readLines().size()} lines"
      }.join('\n')
      throw new GradleException("Source files must not exceed 500 lines:\n${details}")
    }
  }
}

tasks.register('quickQualityCheck') {
  group = 'verification'
  description = 'Runs formatting checks, static analysis, JVM unit tests, and the desktop UI smoke flow.'
  dependsOn subprojects.collect { project ->
    [project.tasks.named('ktlintCheck'), project.tasks.named('detekt')]
  }.flatten()
  dependsOn tasks.named('unitTest')
  dependsOn ':lwjgl3:uiSmokeTest'
  dependsOn tasks.named('verifySourceFileLengths')
}

tasks.register('qualityCheck') {
  group = 'verification'
  description = 'Runs every repository quality gate used by pre-push and CI.'
  dependsOn tasks.named('quickQualityCheck')
  dependsOn tasks.named('behavioralTest'), tasks.named('coverageReport'), tasks.named('mutationTest'), ':android:testDebugUnitTest'
}

tasks.register('preMergeRegressionCheck') {
  group = 'verification'
  description = 'Runs the entire Kotlin suite, entire Dart suite, and complete Dart compatibility inventory.'
  dependsOn tasks.named('qualityCheck'), tasks.named('dartUnitTest'), tasks.named('dartCompatibilityTest')
}

tasks.register('verifyCompatibilityGoldens') {
  group = 'verification'
  description = 'Verifies checked-in compatibility golden masters without regenerating them.'
  dependsOn ':core:compatibilityGoldenTest'
}

tasks.register('regenerateCompatibilityGoldens') {
  group = 'maintenance'
  description = 'Explicitly regenerates compatibility goldens and lists changed files.'
  dependsOn ':core:regenerateCompatibilityGoldens'
}

tasks.register('regenerateBehaviorGolden') {
  group = 'maintenance'
  description = 'Explicitly regenerates every checked-in behavioral golden master.'
  dependsOn ':core:regenerateBehaviorGolden', ':core:regenerateCompatibilityGoldens'
}

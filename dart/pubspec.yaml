name: toy_racers
description: "Cross-platform Flutter and Flame implementation of Toy Racers."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flame: ^1.38.1
  # Flame itself provides rendering and input, while this bridge supplies the
  # platform audio players needed by the presentation-only audio controller.
  flame_audio: ^2.12.2
  flutter:
    sdk: flutter
  # Parses the canonical Tiled TMX sources inside the pure-Dart simulation.
  # Flame's Tiled support belongs to the presentation layer and is not
  # reference-compatible with the Kotlin geometry adapter.
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    # BEGIN GENERATED FLUTTER ASSETS
    - "assets/README.md"
    - "assets/assets.txt"
    - "assets/attribution/SOURCES.md"
    - "assets/audio/background-music.wav"
    - "assets/audio/button-click.wav"
    - "assets/audio/checkpoint.wav"
    - "assets/audio/collision/collision_heavy_01.wav"
    - "assets/audio/collision/collision_heavy_02.wav"
    - "assets/audio/collision/collision_light_01.wav"
    - "assets/audio/collision/collision_light_02.wav"
    - "assets/audio/collision/collision_medium_01.wav"
    - "assets/audio/collision/collision_medium_02.wav"
    - "assets/audio/collision/collision_medium_03.wav"
    - "assets/audio/engine/engine_mid_loop.wav"
    - "assets/audio/finish.wav"
    - "assets/audio/go.wav"
    - "assets/audio/surface/gravel_hit_01.wav"
    - "assets/audio/surface/gravel_hit_02.wav"
    - "assets/audio/surface/gravel_hit_03.wav"
    - "assets/audio/surface/offtrack_grass_loop.wav"
    - "assets/audio/surface/offtrack_gravel_loop.wav"
    - "assets/audio/tires/brake_hard.wav"

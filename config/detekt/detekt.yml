build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: true
  checkExhaustiveness: false

complexity:
  active: true
  CognitiveComplexMethod:
    active: true
    threshold: 31
  ComplexCondition:
    active: true
    threshold: 5
  ComplexInterface:
    active: true
    threshold: 10
  CyclomaticComplexMethod:
    active: true
    threshold: 19
  LargeClass:
    active: true
    threshold: 501
  LongMethod:
    active: true
    threshold: 81
  LongParameterList:
    active: true
    functionThreshold: 10
    constructorThreshold: 10
    ignoreDefaultParameters: true
    ignoreDataClasses: true
  NestedBlockDepth:
    active: true
    threshold: 5
  TooManyFunctions:
    active: true
    thresholdInClasses: 25
    thresholdInFiles: 25
    thresholdInInterfaces: 15
    thresholdInObjects: 20
    thresholdInEnums: 15
    ignorePrivate: false
    ignoreOverridden: true
  StringLiteralDuplication:
    active: true
    threshold: 4
    ignoreAnnotation: true
    excludeStringsWithLessThan5Characters: true

coroutines:
  active: true

empty-blocks:
  active: true

exceptions:
  active: true

naming:
  active: true

performance:
  active: true

potential-bugs:
  active: true

style:
  active: true
  ForbiddenImport:
    active: true
    forbiddenPatterns: 'java\.util\.(?!Locale$).*|kotlinx\.android\.synthetic\..*'
  MagicNumber:
    active: false
  MaxLineLength:
    active: true
    maxLineLength: 120
    excludeCommentStatements: false
  NewLineAtEndOfFile:
    active: true
  ReturnCount:
    active: true
    max: 4
  SerialVersionUIDInSerializableClass:
    active: true
  UnusedPrivateMember:
    active: true
  UnusedParameter:
    active: true
    allowedNames: 'ignored|expected'
  WildcardImport:
    active: true
    excludeImports: []

comments:
  active: true
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false

output-reports:
  active: true

processors:
  active: true

console-reports:
  active: true

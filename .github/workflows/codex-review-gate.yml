name: Codex review gate

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize
      - ready_for_review

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && github.event.changes.base == null && github.run_id || 'active' }}
  cancel-in-progress: true

jobs:
  require-clean-codex-review:
    name: Codex review completed with no open findings
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Verify review for current commit
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const number = context.payload.pull_request.number;
            const reviewer = 'chatgpt-codex-connector';
            const isReviewer = login =>
              login === reviewer || login === `${reviewer}[bot]`;
            const run = await github.rest.actions.getWorkflowRun({
              owner,
              repo,
              run_id: context.runId
            });
            const baseWasEdited =
              context.payload.action === 'edited' &&
              context.payload.changes?.base != null;
            const metadataWasEdited =
              context.payload.action === 'edited' && !baseWasEdited;
            const currentDiffObservedAt = metadataWasEdited
              ? 0
              : Date.parse(run.data.created_at);

            async function getReviewThreads() {
              const threads = [];
              let cursor = null;
              do {
                const result = await github.graphql(`
                  query(
                    $owner: String!,
                    $repo: String!,
                    $number: Int!,
                    $cursor: String
                  ) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewThreads(first: 100, after: $cursor) {
                          pageInfo { hasNextPage endCursor }
                          nodes {
                            id
                            isResolved
                            comments(first: 100) {
                              pageInfo { hasNextPage endCursor }
                              nodes { author { login } }
                            }
                          }
                        }
                      }
                    }
                  }
                `, { owner, repo, number, cursor });
                const page = result.repository.pullRequest.reviewThreads;
                threads.push(...page.nodes);
                cursor = page.pageInfo.hasNextPage
                  ? page.pageInfo.endCursor
                  : null;
              } while (cursor);

              for (const thread of threads) {
                let commentsCursor = thread.comments.pageInfo.hasNextPage
                  ? thread.comments.pageInfo.endCursor
                  : null;
                while (commentsCursor) {
                  const result = await github.graphql(`
                    query($id: ID!, $cursor: String!) {
                      node(id: $id) {
                        ... on PullRequestReviewThread {
                          comments(first: 100, after: $cursor) {
                            pageInfo { hasNextPage endCursor }
                            nodes { author { login } }
                          }
                        }
                      }
                    }
                  `, { id: thread.id, cursor: commentsCursor });
                  const page = result.node.comments;
                  thread.comments.nodes.push(...page.nodes);
                  commentsCursor = page.pageInfo.hasNextPage
                    ? page.pageInfo.endCursor
                    : null;
                }
              }
              return threads;
            }

            for (let attempt = 1; attempt <= 110; attempt += 1) {
              const pullRequest = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: number
              });
              const reviews = await github.paginate(
                github.rest.pulls.listReviews,
                { owner, repo, pull_number: number, per_page: 100 }
              );
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number: number, per_page: 100 }
              );
              const threads = await getReviewThreads();

              const reviewedCurrentCommit = reviews.some(review =>
                !baseWasEdited &&
                isReviewer(review.user?.login) &&
                ['COMMENTED', 'APPROVED'].includes(review.state) &&
                review.commit_id === pullRequest.data.head.sha &&
                Date.parse(review.submitted_at) >= currentDiffObservedAt
              );
              const currentReviewRequests = comments.filter(comment =>
                comment.body?.includes('@codex review') &&
                comment.body.includes(pullRequest.data.head.sha) &&
                comment.body.includes(pullRequest.data.base.sha) &&
                Date.parse(comment.created_at) >= currentDiffObservedAt &&
                comment.created_at === comment.updated_at
              );
              let approvedCurrentHead = false;
              for (const request of currentReviewRequests) {
                const reactions = await github.paginate(
                  github.rest.reactions.listForIssueComment,
                  { owner, repo, comment_id: request.id, per_page: 100 }
                );
                approvedCurrentHead ||= reactions.some(reaction =>
                  isReviewer(reaction.user?.login) && reaction.content === '+1'
                );
              }
              const unresolvedFindings = threads.filter(thread =>
                !thread.isResolved &&
                thread.comments.nodes.some(comment =>
                  isReviewer(comment.author?.login)
                )
              );

              if (
                (reviewedCurrentCommit || approvedCurrentHead) &&
                unresolvedFindings.length === 0
              ) {
                core.info(
                  'Codex reviewed the current HEAD with no unresolved findings.'
                );
                return;
              }

              core.info(
                `Attempt ${attempt}/110: waiting for a clean Codex review; ` +
                `${unresolvedFindings.length} unresolved finding(s). ` +
                `Request with: @codex review ${pullRequest.data.head.sha} ` +
                `base ${pullRequest.data.base.sha}`
              );
              await new Promise(resolve => setTimeout(resolve, 15000));
            }

            core.setFailed(
              'Timed out waiting for Codex to review the current HEAD with no open findings.'
            );

name: Android release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-and-upload-apk:
    name: Test, build, and upload signed APK
    if: ${{ startsWith(github.event.release.tag_name, 'v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Verify release version matches tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          expected_version="${RELEASE_TAG#v}"
          configured_version="$(sed -n 's/^[[:space:]]*versionName "\([^"]*\)"/\1/p' android/build.gradle)"
          test "$configured_version" = "$expected_version"

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/toy-racers-release.jks"
          chmod 600 "$RUNNER_TEMP/toy-racers-release.jks"

      - name: Build signed release APK
        env:
          TOY_RACERS_KEYSTORE_PATH: ${{ runner.temp }}/toy-racers-release.jks
          TOY_RACERS_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          TOY_RACERS_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          TOY_RACERS_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew android:assembleRelease --no-daemon

      - name: Verify and rename APK
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          apk_path="$(find android/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$apk_path"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk_path"
          cp "$apk_path" "toy-racers-${RELEASE_TAG}.apk"

      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "toy-racers-${RELEASE_TAG}.apk" --clobber

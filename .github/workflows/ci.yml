name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_dart_stress_determinism:
        description: Run the optional 20-repeat Dart stress and Kotlin comparison suite.
        required: false
        default: false
        type: boolean
      run_behavioral_stability:
        description: Run all behavioral fixtures twenty times in sequence (long-running).
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  quality:
    name: Formatting, static analysis, UI smoke, and Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Run quality checks and Android debug checks
        run: >-
          xvfb-run --auto-servernum ./gradlew
          ktlintCheck detekt verifySourceFileLengths lwjgl3:uiSmokeTest android:testDebugUnitTest android:assembleDebug
          --no-daemon

      - name: Upload quality reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            **/build/reports/ktlint/**
            **/build/reports/detekt/**
            lwjgl3/build/reports/**
            android/build/reports/tests/**
            android/build/test-results/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Android debug APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Run JVM unit tests
        run: ./gradlew unitTest --no-daemon

      - name: Upload unit-test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            core/build/reports/tests/test/**
            core/build/test-results/test/**
            lwjgl3/build/reports/tests/test/**
            lwjgl3/build/test-results/test/**
          if-no-files-found: warn
          retention-days: 7

  dart-static-analysis:
    name: dart-static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify generated Flutter assets
        run: |-
          python3 tools/test_flutter_asset_pipeline.py
          python3 tools/flutter_asset_pipeline.py check

      - name: Resolve locked Dart dependencies
        working-directory: dart
        run: flutter pub get --enforce-lockfile

      - name: Verify Dart formatting
        working-directory: dart
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Flutter static analysis
        working-directory: dart
        run: flutter analyze --fatal-infos

  dart-unit:
    name: dart-unit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve locked Dart dependencies
        working-directory: dart
        run: flutter pub get --enforce-lockfile

      - name: Run Dart unit and widget tests with coverage
        working-directory: dart
        run: flutter test --coverage

      - name: Upload Dart coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dart-coverage-report
          path: dart/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 7

  dart-compatibility:
    name: dart-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve locked Dart dependencies
        working-directory: dart
        run: flutter pub get --enforce-lockfile

      - name: Replay Dart compatibility inventory against Kotlin goldens
        working-directory: dart
        run: dart run tool/full_behavioral_gate.dart

  kotlin-reference:
    name: kotlin-reference
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Run Kotlin reference tests and compatibility goldens
        run: ./gradlew behavioralCompatibilityTest --no-daemon

      - name: Upload behavioral test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: behavioral-compatibility-reports
          path: |
            core/build/reports/tests/behavioralCompatibilityTest/**
            core/build/reports/tests/compatibilityGoldenTest/**
            core/build/test-results/behavioralCompatibilityTest/**
            core/build/test-results/compatibilityGoldenTest/**
          if-no-files-found: warn
          retention-days: 7

  deterministic-repeat:
    name: Deterministic repeat test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Run deterministic repeat suite
        run: ./gradlew deterministicRepeatTest --no-daemon

      - name: Upload deterministic repeat reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-repeat-reports
          path: |
            core/build/reports/tests/deterministicRepeatTest/**
            core/build/test-results/deterministicRepeatTest/**
          if-no-files-found: warn
          retention-days: 7

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Generate and verify core coverage report
        run: ./gradlew coverageReport --no-daemon

      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: core-coverage-report
          path: |
            core/build/reports/jacoco/test/**
            core/build/test-results/test/**
          if-no-files-found: warn
          retention-days: 7

  mutation:
    name: Mutation score
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Verify mutation score for critical gameplay rules
        run: ./gradlew mutationTest --no-daemon

      - name: Upload mutation report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: core/build/reports/pitest/**
          if-no-files-found: warn
          retention-days: 7

  dart-fuzz:
    name: dart-fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Dart dependencies
        working-directory: dart
        run: flutter pub get --enforce-lockfile

      - name: Run fixed-seed differential fuzz smoke suite
        run: ./gradlew fuzzSmokeTest --no-daemon

      - name: Upload fuzz smoke report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-report
          path: |
            core/build/differential-fuzz/**
          if-no-files-found: warn
          retention-days: 7

  dart-builds:
    name: dart-builds (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
            desktop: false
            command: flutter build apk --debug
            limitation: >-
              This is a debug-APK compile check; device installation, touch,
              lifecycle, and audible-output verification need an emulator or device.
          - platform: web
            runner: ubuntu-latest
            desktop: false
            command: flutter build web --release
            limitation: >-
              This is a release web compile check; deployed-browser interaction and
              audible-output verification remain outside this build job.
          - platform: linux
            runner: ubuntu-latest
            desktop: true
            command: flutter build linux --release
            limitation: >-
              This is a native Linux compile check; GTK runtime interaction and
              audible-output verification need a provisioned desktop session.
          - platform: windows
            runner: windows-latest
            desktop: true
            command: flutter build windows --release
            limitation: >-
              This is a native Windows compile check; keyboard, resize, and audio
              behavior require an interactive Windows session.
          - platform: macos
            runner: macos-latest
            desktop: true
            command: flutter build macos --release
            limitation: >-
              This is a native macOS compile check; keyboard and audio behavior
              require an interactive macOS session.
          - platform: ios-simulator
            runner: macos-latest
            desktop: false
            command: flutter build ios --simulator --debug
            limitation: >-
              This is an unsigned, simulator-compatible iOS build; it does not
              sign for or exercise a physical iOS device.

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK
        if: ${{ matrix.platform == 'android' }}
        uses: android-actions/setup-android@v4

      - name: Install Linux desktop build dependencies
        if: ${{ matrix.platform == 'linux' }}
        run: |-
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Enable Flutter desktop target
        if: ${{ matrix.desktop }}
        run: flutter config --enable-${{ matrix.platform }}-desktop

      - name: Resolve locked Dart dependencies
        working-directory: dart
        run: flutter pub get --enforce-lockfile

      - name: Document platform verification boundary
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          LIMITATION: ${{ matrix.limitation }}
        run: |-
          {
            echo "## ${PLATFORM} build verification"
            echo
            echo "${LIMITATION}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=${PLATFORM} CI boundary::${LIMITATION}"

      - name: Build ${{ matrix.platform }} target
        working-directory: dart
        run: ${{ matrix.command }}

  pre-merge-regression:
    name: pre-merge-regression
    needs:
      - quality
      - unit-tests
      - dart-static-analysis
      - dart-unit
      - dart-compatibility
      - kotlin-reference
      - deterministic-repeat
      - coverage
      - mutation
      - dart-fuzz
      - dart-builds
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve locked Dart dependencies
        working-directory: dart
        run: flutter pub get --enforce-lockfile

      - name: Run complete pre-merge regression gate
        run: >-
          xvfb-run --auto-servernum ./gradlew preMergeRegressionCheck --no-daemon

  dart-stress-determinism:
    name: Optional Dart stress determinism
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_dart_stress_determinism }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Dart dependencies
        working-directory: dart
        run: flutter pub get --enforce-lockfile

      - name: Run Dart stress determinism suite
        run: ./gradlew dartStressDeterminismTest --no-daemon

      - name: Upload Dart stress traces
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dart-stress-traces
          path: core/build/dart-stress/**
          if-no-files-found: warn
          retention-days: 7

  behavioral-stability:
    name: Behavioral suite stability (20 runs)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_behavioral_stability }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Repeat full behavioral fixture inventory twenty times
        run: ./gradlew behavioralStabilityTest --no-daemon

      - name: Upload behavioral stability report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: behavioral-stability-report
          path: |
            core/build/reports/tests/behavioralStabilityTest/**
            core/build/test-results/behavioralStabilityTest/**
          if-no-files-found: warn
          retention-days: 7

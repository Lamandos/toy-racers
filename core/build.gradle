[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

apply plugin: 'jacoco'

jacoco {
  toolVersion = '0.8.13'
}

def unitTestCoverageClasses = sourceSets.main.output.classesDirs.asFileTree.matching {
  include 'com/example/toyracers/ai/**'
  include 'com/example/toyracers/camera/**'
  include 'com/example/toyracers/car/**'
  include 'com/example/toyracers/collision/**'
  include 'com/example/toyracers/input/PlayerControlConfig*'
  include 'com/example/toyracers/input/PlayerInput*'
  include 'com/example/toyracers/race/**'
  include 'com/example/toyracers/surface/**'
  include 'com/example/toyracers/track/**'
}

sourceSets {
  test {
    resources.srcDir rootProject.file('assets')
  }
}

tasks.withType(Test).configureEach {
  inputs.dir(rootProject.file('compatibility/scenarios'))
  inputs.dir(rootProject.file('compatibility/golden'))
  systemProperty 'compatibilityDirectory', rootProject.file('compatibility').absolutePath
  systemProperty 'updateBehavioralGoldens', 'false'
}

tasks.named('test', Test).configure {
  filter {
    excludeTestsMatching 'com.example.toyracers.compat.AiBehaviorScenarioTest'
    excludeTestsMatching 'com.example.toyracers.compat.BehavioralCompatibilityTest'
    excludeTestsMatching 'com.example.toyracers.compat.CompatibilityGoldenMasterTest'
    excludeTestsMatching 'com.example.toyracers.compat.DifferentialFuzzSmokeTest'
    excludeTestsMatching 'com.example.toyracers.compat.FullRaceGoldenScenarioTest'
    excludeTestsMatching 'com.example.toyracers.compat.LongRunningDeterminismTest'
  }
}

tasks.register('behavioralCompatibilityTest', Test) {
  group = 'verification'
  description = 'Runs versioned behavioral scenarios against the legacy golden master.'
  dependsOn testClasses
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  filter {
    includeTestsMatching 'com.example.toyracers.compat.AiBehaviorScenarioTest'
    includeTestsMatching 'com.example.toyracers.compat.BehavioralCompatibilityTest'
  }
}

tasks.register('deterministicRepeatTest', Test) {
  group = 'verification'
  description = 'Runs the long-running deterministic repeat suite.'
  dependsOn testClasses
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  filter.includeTestsMatching 'com.example.toyracers.compat.LongRunningDeterminismTest'
}

tasks.register('regenerateBehaviorGolden', Test) {
  group = 'maintenance'
  description = 'Explicitly regenerates the legacy behavioral golden master.'
  dependsOn testClasses
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  systemProperty 'updateBehavioralGoldens', 'true'
  filter.includeTestsMatching 'com.example.toyracers.compat.BehavioralCompatibilityTest'
  outputs.upToDateWhen { false }
}

tasks.register('runBehaviorScenario', JavaExec) {
  group = 'application'
  description = 'Runs one versioned behavior scenario without a graphics backend.'
  dependsOn classes
  classpath = sourceSets.main.runtimeClasspath + files(rootProject.file('assets'))
  mainClass.set('com.example.toyracers.compat.BehaviorScenarioCliKt')
  workingDir = rootProject.projectDir
  def scenarioProperty = providers.gradleProperty('scenario')
  def outputProperty = providers.gradleProperty('output')
  doFirst {
    def scenario = scenarioProperty.orNull
    def output = outputProperty.orNull
    if (scenario == null || output == null) {
      throw new GradleException(
        'runBehaviorScenario requires -Pscenario=<file> and -Poutput=<file>',
      )
    }
    args '--scenario', scenario, '--output', output
  }
}

tasks.register('generateDifferentialFuzzScenario', JavaExec) {
  group = 'application'
  description = 'Generates one self-contained deterministic differential fuzz scenario.'
  dependsOn classes
  classpath = sourceSets.main.runtimeClasspath
  mainClass.set('com.example.toyracers.compat.DifferentialFuzzScenarioCliKt')
  workingDir = rootProject.projectDir
  def seedProperty = providers.gradleProperty('seed')
  def ticksProperty = providers.gradleProperty('ticks')
  def outputProperty = providers.gradleProperty('output')
  doFirst {
    def seed = seedProperty.orNull
    def ticks = ticksProperty.orNull
    if (seed == null || ticks == null) {
      throw new GradleException(
        'generateDifferentialFuzzScenario requires -Pseed=<signed-64-bit-integer> and -Pticks=<positive-integer>',
      )
    }
    args '--seed', seed, '--ticks', ticks
    if (outputProperty.isPresent()) {
      args '--output', outputProperty.get()
    }
  }
}

tasks.register('differentialFuzzSmokeTest', Test) {
  group = 'verification'
  description = 'Runs 100 fixed-seed generated scenarios through the headless simulation.'
  dependsOn testClasses
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  filter.includeTestsMatching 'com.example.toyracers.compat.DifferentialFuzzSmokeTest'
}

tasks.register('compatibilityGoldenTest', Test) {
  group = 'verification'
  description = 'Verifies checked-in file-per-scenario compatibility golden masters and full-race scenarios.'
  dependsOn testClasses
  testClassesDirs = sourceSets.test.output.classesDirs
  classpath = sourceSets.test.runtimeClasspath
  filter {
    includeTestsMatching 'com.example.toyracers.compat.CompatibilityGoldenMasterTest'
    includeTestsMatching 'com.example.toyracers.compat.FullRaceGoldenScenarioTest'
  }
}

tasks.register('regenerateCompatibilityGoldens', JavaExec) {
  group = 'maintenance'
  description = 'Explicitly regenerates compatibility goldens and lists changed files.'
  dependsOn classes
  classpath = sourceSets.main.runtimeClasspath + files(rootProject.file('assets'))
  mainClass.set('com.example.toyracers.compat.CompatibilityGoldenCliKt')
  workingDir = rootProject.projectDir
  args(
    '--scenarios', rootProject.file('compatibility/scenarios').absolutePath,
    '--goldens', rootProject.file('compatibility/golden').absolutePath,
    '--regenerate',
  )
}

dependencies {
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion"
  testImplementation "junit:junit:4.13.2"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jacocoTestReport {
  dependsOn test
  classDirectories.setFrom(unitTestCoverageClasses)
  reports {
    html.required = true
    xml.required = true
  }
}

jacocoTestCoverageVerification {
  dependsOn jacocoTestReport
  classDirectories.setFrom(unitTestCoverageClasses)
  violationRules {
    rule {
      limit {
        counter = 'LINE'
        minimum = 0.75
      }
    }
  }
}

check.dependsOn jacocoTestCoverageVerification
